name: Build

on:
  push:
    branches: [ "master", "rolling" ]
  pull_request:
    branches: [ "master", "rolling" ]

jobs:
  # master still targets Jazzy only. rolling selects the message_filters::Subscriber
  # constructor and the pcl_conversions CMake target by feature detection, so it is
  # built against every distro it is meant to support.
  distros:
    runs-on: ubuntu-latest
    outputs:
      ros_distros: ${{ steps.pick.outputs.ros_distros }}
    steps:
      - name: Pick ROS distros from target branch
        id: pick
        shell: bash
        run: |
          # For pull requests use the target branch, for pushes the pushed branch.
          ref="${{ github.base_ref || github.ref_name }}"
          case "$ref" in
            master)  distros='["jazzy"]' ;;
            rolling) distros='["jazzy", "lyrical", "rolling"]' ;;
            *)
              echo "::error::No ROS distros mapped for branch '$ref'."
              exit 1
              ;;
          esac
          echo "Branch '$ref' builds against: $distros"
          echo "ros_distros=$distros" >> "$GITHUB_OUTPUT"

  build:
    needs: distros
    name: ${{ matrix.ros_distro }}
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        ros_distro: ${{ fromJSON(needs.distros.outputs.ros_distros) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/ground_segmentation_ros2

      # ground_segmentation is a plain-CMake package that is not released into the
      # ROS index, so it is checked out into the same workspace and built by colcon
      # alongside the wrapper. rosdep sees it in src/ and resolves it from there.
      - name: Checkout ground_segmentation dependency
        uses: actions/checkout@v4
        with:
          repository: dfki-ric/ground_segmentation
          ref: master
          path: src/ground_segmentation

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y \
            --rosdistro "${{ matrix.ros_distro }}"

      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
