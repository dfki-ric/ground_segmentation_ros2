name: Build

# No branch filter, so every branch is built. Add branches: [ "master" ] to both
# triggers if building feature branches creates too much noise.
on:
  push:
  pull_request:

jobs:
  # The sources select the message_filters::Subscriber constructor and the
  # pcl_conversions CMake target by feature detection, so the same code is built
  # against every supported distro.
  build:
    name: ${{ matrix.ros_distro }}
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [ jazzy, lyrical, rolling ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: src/ground_segmentation_ros2

      # ground_segmentation is a plain-CMake package that is not released into the
      # ROS index, so it is checked out into the same workspace and built by colcon
      # alongside the wrapper. rosdep sees it in src/ and resolves it from there.
      - name: Checkout ground_segmentation dependency
        uses: actions/checkout@v7
        with:
          repository: dfki-ric/ground_segmentation
          ref: master
          path: src/ground_segmentation

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y \
            --rosdistro "${{ matrix.ros_distro }}"

      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
